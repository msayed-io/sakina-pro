name: Android Auth Callback Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-auth-callback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://vmidpocwksqdvsyrvcog.supabase.co
      # Publishable client key; this is intentionally bundled in client applications.
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6oJeyINnyeSn6m8wLkxIPQ_-5ogMkzI
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build Android web assets
        run: npm run build:android

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sakeenah-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
