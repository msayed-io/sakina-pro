name: Android Build and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sakina-android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_SUPABASE_URL: https://vmidpocwksqdvsyrvcog.supabase.co
  # Publishable client key; intentionally bundled in the Android client.
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_6oJeyINnyeSn6m8wLkxIPQ_-5ogMkzI

jobs:
  pull-request-check:
    name: Validate Android debug build (no signing secrets)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Android web assets
        run: npm run build:android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Test and assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sakina-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  calculate-version:
    name: Calculate next release version
    if: github.event_name == 'push' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Increment the highest published semantic version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          repository = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = f"https://api.github.com/repos/{repository}/releases?per_page=100&page=1"
          versions = []
          while url:
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  releases = json.load(response)
                  link_header = response.headers.get("Link", "")
              for release in releases:
                  match = re.fullmatch(r"v?(\d+)\.(\d+)\.(\d+)(?:[-+].*)?", release["tag_name"])
                  if match:
                      versions.append(tuple(map(int, match.groups())))
              next_link = re.search(r'<([^>]+)>;\s*rel="next"', link_header)
              url = next_link.group(1) if next_link else None

          major, minor, patch = max(versions, default=(0, 1, 0))
          patch += 1
          if patch > 999:
              minor += 1
              patch = 0
          if minor > 999:
              major += 1
              minor = 0
          version_code = major * 1_000_000 + minor * 1_000 + patch
          if major > 2100 or minor > 999 or patch > 999 or not 1 <= version_code <= 2_100_000_000:
              raise SystemExit("The next Android versionCode would exceed the supported range.")

          version = f"{major}.{minor}.{patch}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"version_code={version_code}\n")
              output.write(f"tag=v{version}\n")
          print(f"Next release: v{version} (Android versionCode {version_code})")
          PY

  signed-release:
    name: Build, sign, and publish Android release
    if: github.event_name == 'push' && github.run_attempt == 1
    needs: calculate-version
    runs-on: ubuntu-24.04
    environment:
      name: android-release
      url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.calculate-version.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Materialize and validate release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SAKEENAH_RELEASE_KEYSTORE_BASE64 }}
          SAKEENAH_RELEASE_STORE_PASSWORD: ${{ secrets.SAKEENAH_RELEASE_STORE_PASSWORD }}
          SAKEENAH_RELEASE_KEY_ALIAS: ${{ secrets.SAKEENAH_RELEASE_KEY_ALIAS }}
          SAKEENAH_RELEASE_KEY_PASSWORD: ${{ secrets.SAKEENAH_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing environment secret: SAKEENAH_RELEASE_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$SAKEENAH_RELEASE_STORE_PASSWORD" || { echo "Missing environment secret: SAKEENAH_RELEASE_STORE_PASSWORD" >&2; exit 1; }
          test -n "$SAKEENAH_RELEASE_KEY_ALIAS" || { echo "Missing environment secret: SAKEENAH_RELEASE_KEY_ALIAS" >&2; exit 1; }
          test -n "$SAKEENAH_RELEASE_KEY_PASSWORD" || { echo "Missing environment secret: SAKEENAH_RELEASE_KEY_PASSWORD" >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sakina-release.jks"
          test -s "$RUNNER_TEMP/sakina-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/sakina-release.jks" -storetype JKS \
            -alias "$SAKEENAH_RELEASE_KEY_ALIAS" \
            -storepass:env SAKEENAH_RELEASE_STORE_PASSWORD >/dev/null
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Build Android web assets
        run: npm run build:android
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build signed APK and Play Store AAB
        working-directory: android
        env:
          SAKEENAH_RELEASE_KEYSTORE: ${{ runner.temp }}/sakina-release.jks
          SAKEENAH_RELEASE_STORE_PASSWORD: ${{ secrets.SAKEENAH_RELEASE_STORE_PASSWORD }}
          SAKEENAH_RELEASE_KEY_ALIAS: ${{ secrets.SAKEENAH_RELEASE_KEY_ALIAS }}
          SAKEENAH_RELEASE_KEY_PASSWORD: ${{ secrets.SAKEENAH_RELEASE_KEY_PASSWORD }}
          VERSION_NAME: ${{ needs.calculate-version.outputs.version }}
          VERSION_CODE: ${{ needs.calculate-version.outputs.version_code }}
        run: |
          set -euo pipefail
          # ── لماذا هذا الملف المؤقت (مُثبت بالقياس لا بالتخمين) ──────────────
          # Robolectric يُنزّل jar اسمه 163 MB بنفسه وقت تشغيل الاختبار، خارج
          # Gradle، من خوادم Maven المركزية. تلك الخوادم ترد على عناوين CI
          # المشتركة بـ HTTP 429 مع retry-after = 86400 ثانية، فتفشل الاختبارات
          # الـ18 كلها دفعة واحدة — ومعها البناء كله لأن testDebugUnitTest
          # تُشغَّل قبل assembleRelease في نفس سطر gradlew.
          #
          # القياس: repo1.maven.org و repo.maven.apache.org (نفس الخادم، اسمان)
          # أعادا 429 / retry-after:86350 من شبكة هذا الـrunner، بينما مرآة
          # Google الرسمية أعادت 200 و163,233,590 بايت وطابقت sha1 المعلن
          # (c2ea93742dee42d01478927baa3ecfd4f84ee6cc) حرفيًا.
          #
          # الحل: نضع مرآة Google أولًا في init script مؤقت، فتصل تبعية
          # robolectricSdkJar عبر Gradle (المخزَّن مؤقتًا) بلا لمس في
          # build.gradle العام. Robolectric نفسه يعمل offline فلا يطلب شيئًا.
          init_script="$RUNNER_TEMP/robolectric-mirror.init.gradle"
          cat > "$init_script" <<'GRADLE_EOF'
          // مرآة Google الرسمية لـMaven Central: أداء عالٍ وبلا حدود معدّل
          // عدوانية على عناوين CI المشتركة.
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2'
          beforeSettings { settings ->
              settings.pluginManagement.repositories { maven { url mirror } }
          }
          allprojects {
              buildscript.repositories { maven { url mirror } }
              repositories { maven { url mirror } }
          }
          GRADLE_EOF
          ./gradlew --no-daemon --init-script "$init_script" \
            clean testDebugUnitTest assembleRelease bundleRelease \
            "-PversionCode=$VERSION_CODE" "-PversionName=$VERSION_NAME"
          rm -f "$init_script"
      - name: Verify package versions and signing certificates
        env:
          VERSION_NAME: ${{ needs.calculate-version.outputs.version }}
          VERSION_CODE: ${{ needs.calculate-version.outputs.version_code }}
          SAKEENAH_RELEASE_STORE_PASSWORD: ${{ secrets.SAKEENAH_RELEASE_STORE_PASSWORD }}
          SAKEENAH_RELEASE_KEY_ALIAS: ${{ secrets.SAKEENAH_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk_dir="android/app/build/outputs/apk/release"
          aab_dir="android/app/build/outputs/bundle/release"
          mapfile -t apks < <(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print)
          mapfile -t aabs < <(find "$aab_dir" -maxdepth 1 -type f -name '*.aab' -print)
          test "${#apks[@]}" -eq 1 || { echo "Expected exactly one release APK; found ${#apks[@]}" >&2; exit 1; }
          test "${#aabs[@]}" -eq 1 || { echo "Expected exactly one release AAB; found ${#aabs[@]}" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/sakina-release-assets"
          apk="$RUNNER_TEMP/sakina-release-assets/sakina-v${VERSION_NAME}.apk"
          aab="$RUNNER_TEMP/sakina-release-assets/sakina-v${VERSION_NAME}.aab"
          cp "${apks[0]}" "$apk"
          cp "${aabs[0]}" "$aab"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-signature.txt" 2>&1
          key_fingerprint="$(keytool -list -v -keystore "$RUNNER_TEMP/sakina-release.jks" \
            -storetype JKS -alias "$SAKEENAH_RELEASE_KEY_ALIAS" \
            -storepass:env SAKEENAH_RELEASE_STORE_PASSWORD 2>/dev/null \
            | awk '/SHA256:/{gsub(":", "", $2); print toupper($2); exit}')"
          apk_fingerprint="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}' "$RUNNER_TEMP/apk-signature.txt")"
          test -n "$key_fingerprint" && test "$apk_fingerprint" = "$key_fingerprint" || {
            echo "The release APK certificate does not match the configured release keystore." >&2
            exit 1
          }
          jarsigner -verify "$aab" >/dev/null
          "$build_tools/aapt" dump badging "$apk" \
            | grep -F "package: name='com.sakeenah.app' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'" >/dev/null
          (cd "$RUNNER_TEMP/sakina-release-assets" && sha256sum "$(basename "$apk")" "$(basename "$aab")" > SHA256SUMS)
          echo "Verified signed APK and AAB for Sakina v${VERSION_NAME} (versionCode ${VERSION_CODE})."
      - name: Upload release build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sakina-android-release-v${{ needs.calculate-version.outputs.version }}
          path: ${{ runner.temp }}/sakina-release-assets/*
          if-no-files-found: error
          retention-days: 30
      # --- OTA (إضافة): نشر تفاضلي عبر فرع ota-bundle + بيان بالبصمات ---
      # الترتيب إلزامي: يُدفع فرع ota-bundle أولًا، ثم تُنشأ الحزمة الاحتياطية،
      # ثم يُكتب البيان، ثم يُنشأ الـRelease في الخطوة التالية. بهذا لا يقرأ
      # التطبيق إصدارًا جديدًا قبل أن تكون ملفاته متاحة (منع خطأ 404).
      - name: Publish OTA delta bundle to ota-bundle branch
        env:
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "dist/index.html missing" >&2; exit 1; }
          # لازم لـ getMissingBundleFiles: البلوجن يقرأ هذا الملف لمطابقة الملفات
          # المدمجة في الـAPK وإعادة استخدامها بلا تنزيل. يُنتجه cap sync تلقائيًا.
          if [ ! -f android/app/src/main/assets/public/ota-builtin-hashes.json ]; then
            npx cap copy android
          fi
          test -f android/app/src/main/assets/public/ota-builtin-hashes.json || {
            echo "ota-builtin-hashes.json missing - delta reuse would silently fail" >&2
            exit 1
          }
          ota_version="${RELEASE_VERSION}.${GITHUB_RUN_NUMBER}"
          stage="$RUNNER_TEMP/ota-bundle-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -a dist/. "$stage"/
          # ممنوع حذف version.json من فرع التخزين (كان يُحذف هنا سابقًا).
          #
          # السبب الجذري لعطب v2.3.47: البيان لم يكن موجودًا على الفرع إطلاقًا،
          # فكان المصدر الوحيد هو:
          #   github.com/.../releases/latest/download/version.json
          # وهي ترد بسلسلة 302 مزدوجة إلى release-assets.githubusercontent.com
          # بلا أي `Access-Control-Allow-Origin`. WebView يعمل على أصل
          # `https://localhost` فيرفض القراءة بـ`TypeError: Failed to fetch`
          # قبل وصول الجسم إلى JS — فيُبتلع الخطأ ويبدو التحديث صامتًا للأبد.
          #
          # الفرع يُقدَّم عبر raw.githubusercontent.com مع CORS صالح، والملفات
          # التي يشير إليها المانيفست من نفس الأصل. الدفع أدناه يحدث *قبل*
          # كتابة المانيفست في خطوة لاحقة، لذا يبقى ترتيب الأمان كما هو،
          # ثم يُعاد دفع المانيفست وحده في نهاية الـjob (خطوة منفصلة).
          cd "$stage"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git checkout -q --orphan ota-bundle
          git add -A
          git commit -q -m "chore(ota): publish bundle ${ota_version}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ota-bundle
          echo "Pushed ota-bundle for ${ota_version} ($(git rev-parse --short HEAD))."
      - name: Package OTA fallback zip and manifest
        env:
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.calculate-version.outputs.tag }}
        run: |
          set -euo pipefail
          test -f dist/index.html || { echo "dist/index.html missing" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ota"
          (cd dist && zip -qr "$RUNNER_TEMP/ota/dist.zip" .)
          test -f "$RUNNER_TEMP/ota/dist.zip"
          unzip -l "$RUNNER_TEMP/ota/dist.zip" | grep -qE ' index\.html$'
          min_native_version="$(tr -d '[:space:]' < ota/min-native-version.txt)"
          test -n "$min_native_version" || { echo "ota/min-native-version.txt is empty" >&2; exit 1; }
          # الإصدار رباعي: نسخة الويب المدمجة في الـAPK تساوي RELEASE_VERSION نفسها،
          # فنضيف run_number جزءًا رابعًا ليكون الإصدار المنشور أحدث دائمًا.
          ota_version="${RELEASE_VERSION}.${GITHUB_RUN_NUMBER}"
          ota_checksum="$(sha256sum "$RUNNER_TEMP/ota/dist.zip" | cut -d' ' -f1)"
          test -n "$ota_checksum"
          OTA_VERSION="$ota_version" \
          MIN_NATIVE_VERSION="$min_native_version" \
          FALLBACK_ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/dist.zip" \
          FALLBACK_ZIP_SHA256="$ota_checksum" \
          RAW_BASE_URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ota-bundle" \
          node scripts/generate-ota-manifest.mjs --out "$RUNNER_TEMP/ota/version.json"
          test -s "$RUNNER_TEMP/ota/version.json"
          python3 - "$RUNNER_TEMP/ota/version.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)
          files = data.get("manifest") or []
          assert files, "manifest is empty"
          assert any(entry.get("file_name") == "index.html" for entry in files), "index.html missing from manifest"
          print(f"OTA {data['version']}: {len(files)} files, minNative={data['minNativeVersion']}")
          PY
      # --- OTA (إضافة): نشر البيان على فرع التخزين بعد تجهيزه ---
      # ضروري للسبب الجذري: البيان يجب أن يُقرأ من أصل يسمح بـCORS.
      # ترتيب الأمان محفوظ: الملفات دُفعت أولًا، والبيان يُدفع الآن، فلا يمكن
      # أن يرى التطبيق إصدارًا جديدًا قبل توفّر ملفاته (لا 404).
      - name: Publish OTA manifest to ota-bundle branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s "$RUNNER_TEMP/ota/version.json"
          stage="$RUNNER_TEMP/ota-manifest-stage"
          rm -rf "$stage"
          git clone -q --depth 1 --branch ota-bundle \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$stage"
          cp "$RUNNER_TEMP/ota/version.json" "$stage/version.json"
          cd "$stage"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -q -m "chore(ota): publish manifest for run ${GITHUB_RUN_NUMBER}"
          git push -q origin HEAD:refs/heads/ota-bundle
          echo "Manifest published to ota-bundle (CORS-enabled origin)."
      - name: Create GitHub Release and attach signed files
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.calculate-version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$RUNNER_TEMP/sakina-release-assets/sakina-v${RELEASE_VERSION}.apk" \
            "$RUNNER_TEMP/sakina-release-assets/sakina-v${RELEASE_VERSION}.aab" \
            "$RUNNER_TEMP/sakina-release-assets/SHA256SUMS" \
            "$RUNNER_TEMP/ota/dist.zip" \
            "$RUNNER_TEMP/ota/version.json" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Sakina v${RELEASE_VERSION}" \
            --generate-notes
          release_url="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/sakina-release.jks" "$RUNNER_TEMP/apk-signature.txt"
