ext {
    minSdkVersion = 24
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    // ── Robolectric: الإصدار + الـjar المطابق ────────────────────────────
    // robolectricVersion يحدد مكتبة الاختبار نفسها.
    // robolectricSdkVersion يحدد android-all-instrumented الذي يشغّل SDK 33
    // (يطابق @Config(sdk = [33])). القيمتان مُقترنتان بقاعدة Robolectric:
    //   Robolectric 4.14.1 → SDK 33 = 13-robolectric-9030017-i7
    // راجع: org.robolectric.plugins.DefaultSdkProvider (PREINSTRUMENTED_VERSION = i7).
    // عند رفع robolectricVersion يجب رفع robolectricSdkVersion معه، وإلا رفض
    // LocalDependencyResolver الملف بـ"jar not present at".
    robolectricVersion = '4.14.1'
    robolectricSdkVersion = '13-robolectric-9030017-i7'
    androidxTestCoreVersion = '1.6.1'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}