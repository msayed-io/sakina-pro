apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

def releaseKeystorePath = System.getenv('SAKEENAH_RELEASE_KEYSTORE')
def releaseStorePassword = System.getenv('SAKEENAH_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SAKEENAH_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SAKEENAH_RELEASE_KEY_PASSWORD') ?: releaseStorePassword
def hasReleaseSigning = [releaseKeystorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }

// ═══ Robolectric: تنزيل jar الـSDK عبر Gradle وتشغيله دون اتصال ═══════════
// خوادم Maven المركزية ترد بـ HTTP 429 (‎retry-after = 24 ساعة) على تنزيل
// Robolectric الذاتي للـjar (163 MB) وقت تشغيل الاختبار، خارج Gradle، فتسقط
// كل اختبارات الويدجت دفعة واحدة. ننزّله عبر Gradle (مستودعه المؤقت ومرآته)،
// وننسخه لمجلد ثابت، ثم يعمل Robolectric في وضع offline فلا يلمس الشبكة.
//
// اسم الملف منقول حرفيًا من org.robolectric.internal.dependency.DependencyJar:
//   "{artifactId}-{version}-{classifier}.{type}"
// وإلا رفضه LocalDependencyResolver بـ"jar not present at".
//
// يجب أن يبقى هذا التعريف قبل كتلة android { } لأن testOptions.all يشير
// إلى المهمة عبر tasks.named.
def robolectricSdkDir = layout.buildDirectory.dir("robolectric-sdk").get().asFile

configurations {
    robolectricSdkJar {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

tasks.register("syncRobolectricSdkJar") {
    description = "Copies the Robolectric android-all-instrumented jar into an offline dir."
    group = "verification"
    def jarFiles = configurations.robolectricSdkJar
    def targetDir = robolectricSdkDir
    def artifactName = "android-all-instrumented-${robolectricSdkVersion}.jar"
    inputs.files(jarFiles)
    outputs.dir(targetDir)
    doLast {
        targetDir.mkdirs()
        def source = jarFiles.singleFile
        def target = new File(targetDir, artifactName)
        if (!target.exists() || target.length() != source.length()) {
            java.nio.file.Files.copy(
                source.toPath(), target.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
            )
        }
        logger.lifecycle("[robolectric] SDK jar ready offline: ${target.name} (${target.length()} bytes)")
    }
}

def buildVersionCode = (project.findProperty('versionCode') ?: '2003025').toString().toInteger()
def buildVersionName = (project.findProperty('versionName') ?: '2.3.25').toString()

android {
    namespace = "com.sakeenah.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sakeenah.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildVersionCode
        versionName buildVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        compose true
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    testOptions {
        unitTests {
            // يمنح Robolectric الوصول إلى res/ و R class الحقيقية.
            // ملاحظة: الخاصية المباشرة هي includeAndroidResources (بلا is في
            // بعض إصدارات AGP)، والمقبول في AGP 8.13 هو isIncludeAndroidResources
            // داخل unitTests.all فقط — لذلك نضبطها عبر كلاهما بأمان.
            includeAndroidResources = true
            all { test ->
                test.systemProperty "robolectric.graphicsMode", "NATIVE"
                // ── وضع Robolectric دون اتصال (إصلاح فشل CI المتكرر) ──────────
                // Robolectric يُنزّل jar بحجم 163 MB بنفسه وقت تشغيل الاختبار
                // (MavenArtifactFetcher)، خارج Gradle تمامًا. خوادم Maven
                // المركزية ترد على ذلك بـ HTTP 429 (retry-after = 24 ساعة)
                // فتفشل كل اختبارات الويدجت دفعة واحدة.
                // الحل: نُنزّل الـjar عبر Gradle (فيدخل مستودعه المؤقت)، وننسخه
                // إلى مجلد ثابت، ثم نُشغّل Robolectric في وضع offline فلا يلمس
                // الشبكة إطلاقًا. انظر المهمة syncRobolectricSdkJar أدناه.
                test.systemProperty "robolectric.offline", "true"
                test.systemProperty "robolectric.dependency.dir", robolectricSdkDir
                // المهمة معرّفة في هذا المشروع (:app) لا في الجذر.
                test.dependsOn tasks.named("syncRobolectricSdkJar")
                test.testLogging { l ->
                    l.showStandardStreams = true
                    l.events("passed", "failed", "skipped")
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // ═══ اختبارات الويدجت (لا تدخل الـ APK) ═══════════════════════════════
    // Robolectric يشغّل RemoteViews على JVM: تضخيم حقيقي + ترميز Parcel،
    // وهو الطريق الوحيد لإثبات أن Bitmaps قابلة للإرسال بلا جهاز.
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    // الـjar الذي يشغّل SDK 33 — يُنزَّل عبر Gradle لا عبر Robolectric.
    // الإصدار مقرون بـrobolectricVersion في variables.gradle.
    robolectricSdkJar "org.robolectric:android-all-instrumented:${robolectricSdkVersion}"
    testImplementation "androidx.test:core:$androidxTestCoreVersion"
    testImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Jetpack Compose for Dynamic Island overlay
    def composeBom = platform('androidx.compose:compose-bom:2024.06.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // ── Sakinah Home & Lock Screen Widget (Jetpack Glance 1.2.0, stable Aug 26 2026) ──
    // Pinned: 1.3.x requires AGP >= 9.2.0 (compileSdk 37); this project is AGP 8.13.0.
    def glanceVersion = '1.2.0'
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.glance:glance-material3:$glanceVersion"

    // Glance 1.2.0 POM requires compose runtime 1.7.8 / ui-graphics 1.6.0.
    // The app pins compose-bom 2024.06.00 (ui 1.6.8). Constraints keep the
    // existing Compose surface untouched while satisfying Glance's floor.
    constraints {
        implementation('androidx.compose.runtime:runtime:1.7.8') { because 'glance-appwidget 1.2.0 floor' }
        implementation('androidx.compose.ui:ui-graphics:1.6.0') { because 'glance-appwidget 1.2.0 floor' }
        implementation('androidx.compose.ui:ui-unit:1.6.0') { because 'glance-appwidget 1.2.0 floor' }
        implementation('androidx.datastore:datastore-preferences:1.1.7') { because 'glance preferences state' }
        implementation('androidx.datastore:datastore-core:1.1.7') { because 'glance preferences state' }
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
